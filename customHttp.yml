# Each first-party script is integrity-pinned. Only the signup service handles form data.
customHeaders:
  - pattern: "**"
    headers:
      - key: Content-Security-Policy
        value: "default-src 'none'; script-src 'sha256-Ay/83es7+hSm+KxwI1CoxVr6lM+2RwU8oZ+ma2YfQ9Y=' 'sha256-5BhVgeh21o5EP3EXa3GVmbUphgAFYFLYcwuCfRIY+go=' 'sha256-tYq6y0MLddQcU3dkF4BkyEEKEobk3VqLiQVqxyrEbCU='; connect-src 'self' https://waitlist.kumpa.fi/challenge; worker-src 'none'; style-src 'self'; img-src 'self'; font-src 'self'; base-uri 'none'; form-action https://waitlist.kumpa.fi/join; frame-ancestors 'none'"
      - key: Strict-Transport-Security
        value: "max-age=63072000; includeSubDomains; preload"
      - key: X-Content-Type-Options
        value: "nosniff"
      - key: Referrer-Policy
        value: "no-referrer"
      - key: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=(), interest-cohort=()"
      - key: Cross-Origin-Opener-Policy
        value: "same-origin"
      - key: Cross-Origin-Resource-Policy
        value: "same-origin"
  # A font file is the browser's for a week (docs/decisions.md, 44). By default
  # Amplify has the browser ask again for every file on every page, and a page
  # that waits for that answer paints once without its fonts and moves when
  # they come. A week and not a year: a file's address does not change with
  # what is in it, so a face drawn again reaches everybody within the week.
  - pattern: "/fonts/*.woff2"
    headers:
      - key: Cache-Control
        value: "public, max-age=604800, s-maxage=31536000"
  - pattern: "/fonts/saiga/*.woff2"
    headers:
      - key: Cache-Control
        value: "public, max-age=604800, s-maxage=31536000"
