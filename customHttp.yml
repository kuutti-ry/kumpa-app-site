# Each first-party script is integrity-pinned. Only the signup service handles form data.
customHeaders:
  - pattern: "**"
    headers:
      - key: Content-Security-Policy
        value: "default-src 'none'; script-src 'sha256-K6OZcKjpaZa1Sbzzj631tmtA9WT6yVB2nAN4WLgi59Y=' 'sha256-9AfWUNbYcP5NF50KQjxWqNOslPQzvw2eF8+7ptEbu3s=' 'sha256-K0WYLCG2PwcAIUal4CaL8e2v4nkvQm7IhkBdEjNy3sw='; connect-src 'self' https://waitlist.kumpa.fi/challenge; worker-src 'none'; style-src 'self'; img-src 'self'; font-src 'self'; base-uri 'none'; form-action https://waitlist.kumpa.fi/join; frame-ancestors 'none'"
      - key: Strict-Transport-Security
        value: "max-age=63072000; includeSubDomains; preload"
      - key: X-Content-Type-Options
        value: "nosniff"
      - key: Referrer-Policy
        value: "no-referrer"
      - key: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=(), interest-cohort=()"
      - key: Cross-Origin-Opener-Policy
        value: "same-origin"
      - key: Cross-Origin-Resource-Policy
        value: "same-origin"
