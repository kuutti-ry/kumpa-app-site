# The two permitted scripts are integrity-pinned. Health checks use the website origin.
customHeaders:
  - pattern: "**"
    headers:
      - key: Content-Security-Policy
        value: "default-src 'none'; script-src 'sha256-K6OZcKjpaZa1Sbzzj631tmtA9WT6yVB2nAN4WLgi59Y=' 'sha256-VmeVGF391f+oJ/bLw+CdvZY+9Kq+sBiXUdUlc2NtOVM='; connect-src 'self'; worker-src 'none'; style-src 'self'; img-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
      - key: Strict-Transport-Security
        value: "max-age=63072000; includeSubDomains; preload"
      - key: X-Content-Type-Options
        value: "nosniff"
      - key: Referrer-Policy
        value: "no-referrer"
      - key: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=(), interest-cohort=()"
      - key: Cross-Origin-Opener-Policy
        value: "same-origin"
      - key: Cross-Origin-Resource-Policy
        value: "same-origin"
